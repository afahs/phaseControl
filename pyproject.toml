[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-clock"
version = "0.1.0"
description = "Measured, bounded-latency CW clock discipline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hardware = ["pyrtlsdr>=0.3", "smbus2>=0.4"]
plots = ["matplotlib>=3.7"]

[project.scripts]
beacon-clock = "beacon_clock.cli:main"

[tool.setuptools]
packages = ["beacon_clock"]
py-modules = ["setClockFreq"]
